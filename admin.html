<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Hà Vy &amp; Thanh An</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{padding:28px 20px 80px}
  .adm{max-width:1000px;margin:0 auto}
  .adm h1{font-family:var(--serif);font-weight:300;font-size:44px;margin:0 0 6px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
  .stat{background:var(--card);border:1px solid var(--line);padding:16px 18px}
  .stat b{display:block;font-family:var(--serif);font-weight:300;font-size:40px;line-height:1}
  .stat span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 14px}
  .tabs button{font:400 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:none;padding:12px 18px;cursor:pointer;min-height:44px}
  .tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tw{overflow-x:auto;background:var(--card);border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;white-space:nowrap}
  .tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--accent);color:#fff}
  .tag.no{background:var(--muted)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .login{max-width:380px;margin:12vh auto}
  .warn{background:#f2e3c7;border-left:3px solid #b5835a;padding:12px 16px;margin:14px 0;font-size:14px}
  .ans input{border:1px solid var(--line);padding:8px;min-height:40px;font-size:14px;margin-bottom:6px}
  .btn.sm{padding:10px 16px;font-size:12px;min-height:40px}
</style>
</head>
<body>
<div id="login" class="login card form">
  <h1 class="h3">Quản trị</h1>
  <label class="field"><span>Mật khẩu</span><input type="password" id="key" autocomplete="current-password" style="font:inherit;border:0;border-bottom:1px solid var(--ink);padding:10px 0;background:transparent;min-height:44px"></label>
  <p class="error" id="loginErr" hidden></p>
  <button class="btn" id="loginBtn" type="button">Vào</button>
</div>

<div class="adm" id="app" hidden>
  <p class="eyebrow">Bảng điều khiển</p>
  <h1>Hà Vy &amp; Thanh An</h1>
  <div class="warn" id="demoWarn" hidden><b>Chế độ DEMO:</b> chưa kết nối Google Sheet nên dữ liệu chỉ nằm trong trình duyệt này. Khách mời gửi từ máy khác sẽ KHÔNG hiện ở đây. Xem HUONG_DAN.md để kết nối.</div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs">
    <button data-t="rsvp" class="on">RSVP</button><button data-t="song">Bài hát</button><button data-t="question">Câu hỏi</button>
  </div>
  <div class="bar"><button class="btn btn--ghost sm" id="refresh" type="button">Làm mới</button><button class="btn btn--ghost sm" id="csv" type="button">Xuất CSV</button><span class="small" id="msg"></span></div>
  <div class="tw"><table id="tbl"></table></div>
</div>

<script src="content.js"></script>
<script src="store.js"></script>
<script>
(function(){
  var C=window.WEDDING, $=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})};
  var key="", tab="rsvp", data={rsvp:[],song:[],question:[]};
  var cols={
    rsvp:[["name","Tên"],["attending","Tham dự",function(r){return r.attending==="yes"?'<span class="tag">Có</span>':'<span class="tag no">Không</span>'}],["guests","Số người"],["companions","Đi cùng"],["diet","Ăn uống"],["message","Lời nhắn"],["updatedAt","Cập nhật",function(r){return r.updatedAt?new Date(r.updatedAt).toLocaleString("vi-VN"):""}]],
    song:[["title","Bài hát"],["artist","Nghệ sĩ"],["by","Người gửi"],["createdAt","Lúc gửi",function(r){return r.createdAt?new Date(r.createdAt).toLocaleString("vi-VN"):""}]],
    question:[["text","Câu hỏi"],["by","Người hỏi"],["answer","Trả lời",function(r){
      return '<div class="ans"><input type="text" data-id="'+esc(r.id)+'" value="'+esc(r.answer||"")+'" placeholder="Nhập câu trả lời" style="width:100%;min-width:220px"> <button class="btn sm" data-save="'+esc(r.id)+'" type="button">Lưu</button></div>'}]]
  };

  function login(){
    key=$("key").value; $("loginErr").hidden=true;
    if(!Store.live() && key!==C.adminKey){fail("Sai mật khẩu.");return}
    load().then(function(){$("login").hidden=true;$("app").hidden=false;try{sessionStorage.setItem("hvta:k",key)}catch(e){}})
      .catch(function(e){fail(/key|auth|unauth/i.test(e.message)?"Sai mật khẩu.":"Không kết nối được Google Sheet: "+e.message)});
  }
  function fail(m){var e=$("loginErr");e.textContent=m;e.hidden=false}

  function load(){
    $("demoWarn").hidden=Store.live();
    return Promise.all(["rsvp","song","question"].map(function(t){return Store.list(t,key).then(function(r){data[t]=r||[]})})).then(draw);
  }

  function draw(){
    var r=data.rsvp, yes=r.filter(function(x){return x.attending==="yes"}), heads=yes.reduce(function(a,x){return a+(+x.guests||0)},0);
    $("stats").innerHTML=[[r.length,"Phản hồi"],[yes.length,"Xác nhận đến"],[r.length-yes.length,"Không đến được"],[heads,"Tổng số khách"],[data.song.length,"Bài hát"],[data.question.filter(function(q){return !q.answer}).length,"Câu hỏi chưa trả lời"]]
      .map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
    var c=cols[tab], rows=data[tab].slice().sort(function(a,b){return String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt))});
    $("tbl").innerHTML='<thead><tr>'+c.map(function(x){return'<th>'+x[1]+'</th>'}).join("")+'</tr></thead><tbody>'+
      (rows.length?rows.map(function(r){return'<tr>'+c.map(function(x){return'<td>'+(x[2]?x[2](r):esc(r[x[0]]))+'</td>'}).join("")+'</tr>'}).join(""):'<tr><td colspan="'+c.length+'" class="small">Chưa có dữ liệu.</td></tr>')+'</tbody>';
  }

  function csv(){
    var c=cols[tab], q=function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
    var lines=[c.map(function(x){return q(x[1])}).join(",")].concat(data[tab].map(function(r){return c.map(function(x){return q(r[x[0]])}).join(",")}));
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));
    a.download="dam-cuoi-"+tab+".csv";document.body.appendChild(a);a.click();a.remove();
  }

  $("loginBtn").onclick=login;
  $("key").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
  $("tabs").onclick=function(e){var b=e.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;[].forEach.call($("tabs").children,function(x){x.classList.toggle("on",x===b)});draw()};
  $("refresh").onclick=function(){$("msg").textContent="Đang tải…";load().then(function(){$("msg").textContent="Đã cập nhật."}).catch(function(e){$("msg").textContent="Lỗi: "+e.message})};
  $("csv").onclick=csv;
  $("tbl").onclick=function(e){
    var b=e.target.closest("button[data-save]");if(!b)return;
    var id=b.dataset.save, inp=$("tbl").querySelector('input[data-id="'+id+'"]');
    Store.answer(id,inp.value.trim(),key).then(function(){
      data.question.forEach(function(q){if(q.id===id)q.answer=inp.value.trim()});$("msg").textContent="Đã lưu câu trả lời.";draw()});
  };
  try{var k=sessionStorage.getItem("hvta:k");if(k){$("key").value=k;login()}}catch(e){}
})();
</script>
</body>
</html>
